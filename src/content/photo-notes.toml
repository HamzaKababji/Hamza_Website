# Hand-edited notes per photo, merged in by `npm run photos`. Keyed by photo id (the file name).
#   alt    = alt text (what the photo shows, for screen readers)
#   city   = city for photos in a country folder (the camera records no GPS)
#   person = true if anyone is in it (such photos are never used on the home page)
#   draft  = true while Hamza hasn't checked it. Delete the line once it's right.
#
# Claude drafted all of these by looking at the photos. Cities marked "# guess" are from
# landmarks in the frame. Photos with no city are captioned with the country name.

