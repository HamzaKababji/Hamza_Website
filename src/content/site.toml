# Home page settings. Edit, run `npm run photos` if you changed a crop, then push.

[hero]
file  = "DSCF2776"          # Rattlesnake Point/_site/DSCF2776.JPG (Hamza himself)
focus = "62% 30%"           # desktop object-position inside the desktop crop
mobile_focus = "50% 30%"    # mobile object-position inside the mobile crop
# Crop boxes on the original, as fractions of its width/height: [left, top, width, height].
# Desktop: Hamza right of centre, less sky. Mobile: taller, with Hamza centred.
desktop_crop = [0.09, 0.06, 0.65, 0.94]
mobile_crop  = [0.23, 0.0, 0.54, 1.0]
alt = "Hamza standing in tall autumn grass at Rattlesnake Point, a quarry lake and the evening sky behind him"

[specs]
based_in = "London, ON"
studying = "Software Eng."
co_founded = "WE AutoPilot"
shooting = "X-T2, 23mm f/2"
